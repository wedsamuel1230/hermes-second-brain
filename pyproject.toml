[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-second-brain"
version = "0.1.0"
description = "A deterministic, file-first second brain for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "W Ed", email = "357026303+AJiTheHermes@users.noreply.github.com" }]
keywords = ["agent-memory", "second-brain", "hermes", "pkm", "markdown"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
hsb = "hsb.cli:main"

[project.urls]
Homepage = "https://github.com/wedsamuel1230/hermes-second-brain"
Inspiration = "https://github.com/garrytan/gbrain"

[tool.setuptools]
packages = ["hsb"]
